<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunities – ScholarSeek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --blue:#2563EB; --blue-dark:#1d4ed8; --blue-light:#DBEAFE; --text:#111827; --muted:#6B7280; --border:#E5E7EB; }
    [hidden] { display: none !important; }
    body { font-family: 'Inter', sans-serif; color: var(--text); background: #F9FAFB; min-height: 100vh; }
    a { color: var(--blue); }

    nav { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 40px; background:#fff; border-bottom:1px solid var(--border); }
    .nav-logo { display:flex; align-items:center; gap:8px; text-decoration:none; font-weight:800; letter-spacing:-0.5px; color:var(--text); }
    .nav-logo span span { color: var(--blue); }
    .nav-links { display:flex; gap:22px; }
    .nav-links a { text-decoration:none; font-size:.9rem; font-weight:500; color:var(--muted); }
    .nav-links a:hover, .nav-links a.active { color: var(--blue); }
    .nav-actions { display:flex; align-items:center; gap:10px; }
    .nav-user { font-size:.85rem; font-weight:600; margin-right:6px; }
    .btn-outline-sm, .btn-primary-sm { text-decoration:none; font-size:.85rem; font-weight:600; padding:8px 18px; border-radius:50px; }
    .btn-outline-sm { border:1.5px solid #D1D5DB; color:var(--text); background:#fff; }
    .btn-primary-sm { background:var(--blue); color:#fff; border:1.5px solid var(--blue); }

    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; }
    .sub { color: var(--muted); margin-bottom: 24px; font-size: .95rem; }

    .card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:20px; }
    .filters { display:grid; grid-template-columns: 2fr 1fr auto; gap:14px; align-items:end; }
    .filters label { display:block; font-size:.78rem; font-weight:500; margin-bottom:5px; }
    .filters input, .filters select { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:8px; font:inherit; font-size:.9rem; outline:none; background:#fff; }
    .filters input:focus, .filters select:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    .btn { padding:11px 22px; background:var(--blue); color:#fff; border:none; border-radius:50px; font:inherit; font-weight:700; font-size:.9rem; cursor:pointer; }
    .btn:hover { background: var(--blue-dark); }
    .btn:disabled { opacity:.6; cursor:default; }
    .btn.secondary { background:#fff; color:var(--blue); border:1.5px solid var(--blue); }
    .btn.secondary:hover { background:var(--blue-light); }

    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:18px 0 12px; flex-wrap:wrap; }
    #status { color: var(--muted); font-size: .9rem; }
    .error { color:#DC2626; }
    .warn { background:#FEF3C7; border:1px solid #FDE68A; color:#92400E; border-radius:10px; padding:12px 14px; font-size:.88rem; margin-bottom:14px; }

    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap:16px; }
    .op { display:flex; flex-direction:column; gap:8px; }
    .op h3 { font-size:1.02rem; line-height:1.35; }
    .op .org { color:var(--muted); font-size:.85rem; }
    .op p.desc { font-size:.88rem; line-height:1.55; color:#374151; flex:1; }
    .op .meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:.78rem; color:var(--muted); }
    .badge { display:inline-block; font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:50px; background:var(--blue-light); color:var(--blue-dark); }
    .badge.soon { background:#FEE2E2; color:#B91C1C; }
    .badge.closed { background:#F3F4F6; color:var(--muted); }
    .op .apply { align-self:flex-start; margin-top:4px; }

    .pager { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:24px; font-size:.9rem; color:var(--muted); }
    @media (max-width: 640px) { nav { padding: 12px 16px; } .nav-links { display:none; } .filters { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo"><span>Scholar<span>Seek</span></span></a>
    <div class="nav-links">
      <a href="universities.html">Universities</a>
      <a href="opportunities.html" class="active">Opportunities</a>
    </div>
    <div class="nav-actions" id="nav-actions">
      <a href="login.html" class="btn-outline-sm">Login</a>
      <a href="signup.html" class="btn-primary-sm">Sign Up</a>
    </div>
  </nav>

  <main>
    <h1>Opportunities</h1>
    <p class="sub">Scholarships, internships and programs from the Edutu network. Leave a field empty to skip it.</p>

    <div class="card" id="gate" hidden>
      <p id="gate-msg"></p>
    </div>

    <form class="card filters" id="filters" hidden>
      <div><label for="f-q">Keyword</label><input id="f-q" name="q" placeholder="title, organization or description" maxlength="100" /></div>
      <div><label for="f-category">Category</label>
        <select id="f-category" name="category"><option value="">All categories</option></select>
      </div>
      <div><button class="btn" type="submit" id="search-btn">Search</button></div>
    </form>

    <div class="toolbar">
      <div id="status"></div>
      <button class="btn secondary" id="sync-btn" type="button" hidden>Refresh from Edutu</button>
    </div>
    <div id="warning" class="warn" hidden></div>

    <div class="grid" id="results"></div>

    <div class="pager" id="pager" hidden>
      <button class="btn secondary" id="prev" type="button">← Previous</button>
      <span id="page-info"></span>
      <button class="btn secondary" id="next" type="button">Next →</button>
    </div>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    // Build DOM safely: all API text goes through textContent, never innerHTML.
    function el(tag, props, ...kids) {
      const e = document.createElement(tag);
      Object.assign(e, props || {});
      kids.flat().forEach((k) => e.append(k));
      return e;
    }
    const form = (obj) => new URLSearchParams(obj);

    async function api(path, opts) {
      const res = await fetch(path, opts);
      let data = {};
      try { data = await res.json(); } catch (e) { /* non-JSON */ }
      return { status: res.status, data };
    }
    function gate(msg) { $('#gate-msg').textContent = msg; $('#gate').hidden = false; }
    function showStatus(msg, isError) { const s = $('#status'); s.textContent = msg; s.className = isError ? 'error' : ''; }

    let state = { page: 1, q: '', category: '' };
    let categoriesLoaded = false;

    // ----- navbar + access gate -----
    async function init() {
      let me;
      try { me = (await api('/api/me')).data; }
      catch (e) { return gate('Cannot reach the server. Start it with "python server.py" and open http://127.0.0.1:8080/opportunities.html'); }

      if (!me.loggedIn) {
        $('#gate-msg').append('Please ', el('a', { href: 'login.html', textContent: 'log in' }), ' or ',
          el('a', { href: 'signup.html', textContent: 'create an account' }), ' to see opportunities.');
        $('#gate').hidden = false;
        return;
      }
      const box = $('#nav-actions');
      box.textContent = '';
      const out = el('a', { href: '#', className: 'btn-outline-sm', textContent: 'Logout' });
      out.onclick = async (e) => { e.preventDefault(); await api('/api/logout', { method: 'POST', body: form({}) }); location.href = 'login.html'; };
      box.append(el('span', { className: 'nav-user', textContent: 'Hi, ' + me.user.name }), out);

      $('#filters').hidden = false;
      if (me.user.role === 'admin') $('#sync-btn').hidden = false;
      load();
    }

    // ----- load + render -----
    async function load() {
      const params = new URLSearchParams({ page: state.page });
      if (state.q) params.set('q', state.q);
      if (state.category) params.set('category', state.category);
      $('#search-btn').disabled = true;
      showStatus('Loading…');
      const { data } = await api('/api/opportunities?' + params).catch(() => ({ data: {} }));
      $('#search-btn').disabled = false;
      if (!data.ok) { showStatus(data.error || 'Could not load opportunities. Is the server running?', true); return; }

      const warn = $('#warning');
      warn.hidden = !data.syncError;
      warn.textContent = data.syncError ? 'Could not load data from Edutu: ' + data.syncError : '';

      if (!categoriesLoaded && data.categories.length) {
        const sel = $('#f-category');
        data.categories.forEach((c) => sel.append(el('option', { value: c, textContent: c })));
        categoriesLoaded = true;
      }
      render(data);
    }

    function stripTags(s) { return String(s || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
    function shorten(s, n) { return s.length > n ? s.slice(0, n).trimEnd() + '…' : s; }

    function deadlineBadge(iso) {
      if (!iso) return null;
      const days = Math.ceil((new Date(iso + 'T23:59:59') - new Date()) / 86400000);
      if (days < 0) return el('span', { className: 'badge closed', textContent: 'Closed ' + iso });
      if (days <= 14) return el('span', { className: 'badge soon', textContent: 'Closes in ' + days + ' day' + (days === 1 ? '' : 's') });
      return el('span', { className: 'badge', textContent: 'Deadline ' + iso });
    }

    function render(data) {
      const box = $('#results');
      box.textContent = '';
      const rows = data.results;
      if (!rows.length) {
        showStatus(data.syncError ? '' : 'No opportunities match those filters.');
        $('#pager').hidden = true;
        return;
      }
      showStatus(data.total + ' opportunit' + (data.total === 1 ? 'y' : 'ies') + ' found.');

      rows.forEach((r) => {
        const meta = el('div', { className: 'meta' });
        if (r.category) meta.append(el('span', { className: 'badge', textContent: r.category }));
        if (r.location) meta.append(el('span', { textContent: '📍 ' + r.location }));
        const d = deadlineBadge(r.deadline);
        if (d) meta.append(d);

        const card = el('div', { className: 'card op' },
          el('h3', { textContent: r.title }),
          r.organization ? el('div', { className: 'org', textContent: r.organization }) : '',
          meta,
          r.description ? el('p', { className: 'desc', textContent: shorten(stripTags(r.description), 220) }) : '');
        // only http(s) links: never render javascript: URLs coming from an external API
        if (/^https?:\/\//i.test(r.url || '')) {
          card.append(el('a', { className: 'btn-primary-sm apply', href: r.url, target: '_blank', rel: 'noopener noreferrer', textContent: 'View / Apply' }));
        }
        box.append(card);
      });

      const pages = Math.max(1, Math.ceil(data.total / data.pageSize));
      $('#pager').hidden = pages <= 1;
      $('#page-info').textContent = 'Page ' + data.page + ' of ' + pages;
      $('#prev').disabled = data.page <= 1;
      $('#next').disabled = data.page >= pages;
    }

    // ----- events -----
    $('#filters').addEventListener('submit', (e) => {
      e.preventDefault();
      state = { page: 1, q: $('#f-q').value.trim(), category: $('#f-category').value };
      load();
    });
    $('#prev').onclick = () => { state.page = Math.max(1, state.page - 1); load(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    $('#next').onclick = () => { state.page += 1; load(); window.scrollTo({ top: 0, behavior: 'smooth' }); };

    $('#sync-btn').onclick = async () => {
      const btn = $('#sync-btn');
      btn.disabled = true; showStatus('Refreshing from Edutu…');
      const { data } = await api('/api/admin/sync-opportunities', { method: 'POST', body: form({}) }).catch(() => ({ data: {} }));
      btn.disabled = false;
      if (!data.ok) { showStatus(data.error || 'Refresh failed. Is the server running?', true); return; }
      state.page = 1;
      await load();
      showStatus('Refreshed: ' + data.saved + ' saved' + (data.skipped ? ', ' + data.skipped + ' skipped' : '') + '.');
    };

    init();
  </script>
</body>
</html>
