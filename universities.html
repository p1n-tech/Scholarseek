<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universities – ScholarSeek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --blue:#2563EB; --blue-dark:#1d4ed8; --blue-light:#DBEAFE; --text:#111827; --muted:#6B7280; --border:#E5E7EB; }
    [hidden] { display: none !important; }
    body { font-family: 'Inter', sans-serif; color: var(--text); background: #F9FAFB; min-height: 100vh; }
    a { color: var(--blue); }

    nav { display:flex; align-items:center; justify-content:space-between; padding:14px 40px; background:#fff; border-bottom:1px solid var(--border); }
    .nav-logo { display:flex; align-items:center; gap:8px; text-decoration:none; font-weight:800; letter-spacing:-0.5px; color:var(--text); }
    .nav-logo span span { color: var(--blue); }
    .nav-links { display:flex; gap:22px; }
    .nav-links a { text-decoration:none; font-size:.9rem; font-weight:500; color:var(--muted); }
    .nav-links a:hover, .nav-links a.active { color: var(--blue); }
    .nav-actions { display:flex; align-items:center; gap:10px; }
    .nav-user { font-size:.85rem; font-weight:600; margin-right:6px; }
    .btn-outline-sm, .btn-primary-sm { text-decoration:none; font-size:.85rem; font-weight:600; padding:8px 18px; border-radius:50px; }
    .btn-outline-sm { border:1.5px solid #D1D5DB; color:var(--text); background:#fff; }
    .btn-primary-sm { background:var(--blue); color:#fff; border:1.5px solid var(--blue); }

    main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 64px; }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; }
    .sub { color: var(--muted); margin-bottom: 24px; font-size: .95rem; }

    .card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:20px; }
    .filters { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap:14px; align-items:end; }
    .filters label { display:block; font-size:.78rem; font-weight:500; margin-bottom:5px; }
    .filters input { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:8px; font:inherit; font-size:.9rem; outline:none; }
    .filters input:focus, textarea:focus, select:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    .btn { padding:11px 22px; background:var(--blue); color:#fff; border:none; border-radius:50px; font:inherit; font-weight:700; font-size:.9rem; cursor:pointer; }
    .btn:hover { background: var(--blue-dark); }
    .btn:disabled { opacity:.6; cursor:default; }

    #status { margin: 18px 0 10px; color: var(--muted); font-size: .9rem; }
    .error { color:#DC2626; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:.88rem; background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; }
    th, td { padding:12px 14px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
    th { background:#F3F4F6; font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    tbody tr { cursor:pointer; }
    tbody tr:hover { background:#F0F6FF; }
    .uni-name { font-weight:600; color:var(--blue); }
    .badge { display:inline-block; font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:50px; background:var(--blue-light); color:var(--blue-dark); margin-right:4px; }

    #overlay { position:fixed; inset:0; background:rgba(17,24,39,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50; }
    #detail { background:#fff; border-radius:16px; max-width:720px; width:100%; padding:28px; position:relative; }
    #close { position:absolute; top:14px; right:18px; border:none; background:none; font-size:1.6rem; cursor:pointer; color:var(--muted); }
    #detail h2 { font-size:1.4rem; margin-bottom:4px; padding-right:30px; }
    #detail h3 { font-size:.95rem; margin:20px 0 8px; }
    #detail ul { padding-left:20px; font-size:.9rem; line-height:1.6; }
    .meta { color:var(--muted); font-size:.9rem; margin-bottom:10px; }
    .review { border-top:1px solid var(--border); padding:10px 0; font-size:.88rem; }
    .stars { color:#F59E0B; letter-spacing:1px; }
    .review small { color:var(--muted); }
    #review-form { margin-top:16px; display:grid; gap:10px; }
    textarea, select { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:8px; font:inherit; font-size:.9rem; outline:none; }
    @media (max-width: 640px) { nav { padding: 12px 16px; } .nav-links { display:none; } }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo"><span>Scholar<span>Seek</span></span></a>
    <div class="nav-links">
      <a href="universities.html" class="active">Universities</a>
      <a href="opportunities.html">Opportunities</a>
    </div>
    <div class="nav-actions" id="nav-actions">
      <a href="login.html" class="btn-outline-sm">Login</a>
      <a href="signup.html" class="btn-primary-sm">Sign Up</a>
    </div>
  </nav>

  <main>
    <h1>Find your university</h1>
    <p class="sub">Search partner and non-partner universities by major, country, budget and your academic scores. Leave a field empty to skip it.</p>

    <div class="card" id="gate" hidden>
      <p id="gate-msg"></p>
    </div>

    <form class="card filters" id="filters" hidden>
      <div><label for="f-major">Major</label><input id="f-major" name="major" placeholder="e.g. Computer Science" maxlength="100" /></div>
      <div><label for="f-country">Country</label><input id="f-country" name="country" placeholder="e.g. Japan" maxlength="100" /></div>
      <div><label for="f-budget">Max budget / year (USD)</label><input id="f-budget" name="budget" type="number" min="0" step="any" placeholder="tuition + living" /></div>
      <div><label for="f-gpa">Your GPA (0–4)</label><input id="f-gpa" name="gpa" type="number" min="0" max="4" step="0.01" /></div>
      <div><label for="f-ielts">Your IELTS (0–9)</label><input id="f-ielts" name="ielts" type="number" min="0" max="9" step="0.5" /></div>
      <div><label for="f-keyword">Keyword</label><input id="f-keyword" name="keyword" placeholder="university or major name" maxlength="100" /></div>
      <div><button class="btn" type="submit" id="search-btn">Search</button></div>
    </form>

    <div id="status"></div>
    <div class="table-wrap" id="results-wrap" hidden>
      <table>
        <thead><tr><th>University</th><th>Country</th><th>Major</th><th>Tuition</th><th>Total / yr</th><th></th><th>Rating</th></tr></thead>
        <tbody id="results"></tbody>
      </table>
    </div>
  </main>

  <div id="overlay" hidden>
    <div id="detail" role="dialog" aria-modal="true">
      <button id="close" aria-label="Close">×</button>
      <div id="detail-body"></div>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    // Build DOM safely: all database text goes through textContent, never innerHTML.
    function el(tag, props, ...kids) {
      const e = document.createElement(tag);
      Object.assign(e, props || {});
      kids.flat().forEach((k) => e.append(k));
      return e;
    }
    const money = (n) => '$' + Math.round(n).toLocaleString('en-US');
    const form = (obj) => new URLSearchParams(obj);

    async function api(path, opts) {
      const res = await fetch(path, opts);
      let data = {};
      try { data = await res.json(); } catch (e) { /* non-JSON */ }
      return { status: res.status, data };
    }

    // ----- navbar + access gate -----
    async function init() {
      let me;
      try { me = (await api('/api/me')).data; }
      catch (e) { return gate('Cannot reach the server. Start scholarseek_web and open http://localhost:8080/universities.html'); }

      if (me.loggedIn) {
        const box = $('#nav-actions');
        box.textContent = '';
        const out = el('a', { href: '#', className: 'btn-outline-sm', textContent: 'Logout' });
        out.onclick = async (e) => { e.preventDefault(); await api('/api/logout', { method: 'POST', body: form({}) }); location.reload(); };
        box.append(el('span', { className: 'nav-user', textContent: 'Hi, ' + me.user.name }), out);
      }
      if (!me.loggedIn) {
        $('#gate-msg').append('Please ', el('a', { href: 'login.html', textContent: 'log in' }), ' or ',
          el('a', { href: 'signup.html', textContent: 'create an account' }), ' to search universities.');
        $('#gate').hidden = false;
      } else if (me.user.role !== 'student') {
        gate('Searching universities is available to student accounts.');
      } else {
        $('#filters').hidden = false;
      }
    }
    function gate(msg) { $('#gate-msg').textContent = msg; $('#gate').hidden = false; }

    // ----- search -----
    $('#filters').addEventListener('submit', async (e) => {
      e.preventDefault();
      const params = new URLSearchParams();
      new FormData(e.target).forEach((v, k) => { if (String(v).trim()) params.set(k, String(v).trim()); });
      const btn = $('#search-btn');
      btn.disabled = true;
      $('#status').className = ''; $('#status').textContent = 'Searching…';
      const { status, data } = await api('/api/search?' + params).catch(() => ({ status: 0, data: {} }));
      btn.disabled = false;
      if (!data.ok) { showStatus(data.error || 'Search failed. Is the server running?', true); $('#results-wrap').hidden = true; return; }
      renderResults(data.results);
    });

    function showStatus(msg, isError) { const s = $('#status'); s.textContent = msg; s.className = isError ? 'error' : ''; }

    function renderResults(rows) {
      const body = $('#results');
      body.textContent = '';
      $('#results-wrap').hidden = rows.length === 0;
      if (!rows.length) { showStatus('Sorry, no university matches those criteria. Try a higher budget or fewer filters.'); return; }
      showStatus(rows.length + ' result' + (rows.length === 1 ? '' : 's') + ' — click a row for details.');
      rows.forEach((r) => {
        const badges = el('td', {});
        if (r.partner) badges.append(el('span', { className: 'badge', textContent: 'Partner' }));
        if (r.scholarship) badges.append(el('span', { className: 'badge', textContent: 'Scholarship' }));
        const tr = el('tr', { tabIndex: 0 },
          el('td', { className: 'uni-name', textContent: r.name }),
          el('td', { textContent: r.country }),
          el('td', { textContent: r.major }),
          el('td', { textContent: money(r.tuition) }),
          el('td', { textContent: money(r.total) }),
          badges,
          el('td', { textContent: r.rating > 0 ? r.rating.toFixed(1) + ' ★' : '–' }));
        tr.onclick = () => openDetail(r.id);
        tr.onkeydown = (e) => { if (e.key === 'Enter') openDetail(r.id); };
        body.append(tr);
      });
    }

    // ----- detail panel -----
    async function openDetail(id) {
      const { data } = await api('/api/university?id=' + encodeURIComponent(id)).catch(() => ({ data: {} }));
      if (!data.ok) { showStatus(data.error || 'Could not load that university.', true); return; }
      const u = data.university;
      const body = $('#detail-body');
      body.textContent = '';

      body.append(el('h2', { textContent: u.name }));
      body.append(el('p', { className: 'meta', textContent: [u.city, u.country].filter(Boolean).join(', ') + (u.partner ? '  ·  Partner university' : '') }));
      if (u.description) body.append(el('p', { textContent: u.description }));
      if (/^https?:\/\//i.test(u.website)) {      // only http(s) links: never render javascript: URLs from the DB
        body.append(el('p', {}, el('a', { href: u.website, target: '_blank', rel: 'noopener noreferrer', textContent: 'Official website' })));
      }
      body.append(el('p', { className: 'meta', textContent: 'Estimated living cost: ' + money(u.living) + '/yr  ·  ' +
        (u.reviewCount ? u.rating.toFixed(1) + ' / 5 (' + u.reviewCount + ' reviews)' : 'no reviews yet') }));

      body.append(el('h3', { textContent: 'Programs' }), el('ul', {}, data.programs.map((p) => el('li', { textContent: p }))));
      body.append(el('h3', { textContent: 'Scholarships' }));
      body.append(data.scholarships.length ? el('ul', {}, data.scholarships.map((s) => el('li', { textContent: s }))) : el('p', { className: 'meta', textContent: 'None listed.' }));
      if (u.admissionNotes) body.append(el('h3', { textContent: 'Admission notes' }), el('p', { textContent: u.admissionNotes }));

      body.append(el('h3', { textContent: 'Reviews' }));
      if (!data.reviews.length) body.append(el('p', { className: 'meta', textContent: 'No reviews yet. Be the first!' }));
      data.reviews.forEach((r) => body.append(el('div', { className: 'review' },
        el('span', { className: 'stars', textContent: '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating) }), ' ',
        el('small', { textContent: r.author + ' · ' + r.date }),
        el('div', { textContent: r.comment }))));

      body.append(reviewForm(u.id));
      $('#overlay').hidden = false;
    }

    function reviewForm(universityId) {
      const rating = el('select', {}, [5, 4, 3, 2, 1].map((n) => el('option', { value: n, textContent: n + ' – ' + ['', 'Poor', 'Fair', 'Good', 'Very good', 'Excellent'][n] })));
      const comment = el('textarea', { rows: 3, maxLength: 1000, placeholder: 'Share your thoughts (optional)' });
      const msg = el('div', { className: 'meta' });
      const btn = el('button', { className: 'btn', type: 'submit', textContent: 'Submit review' });
      const f = el('form', { id: 'review-form' }, el('h3', { textContent: 'Write or update your review' }), rating, comment, btn, msg);
      f.onsubmit = async (e) => {
        e.preventDefault();
        btn.disabled = true;
        const { data } = await api('/api/review', { method: 'POST', body: form({ university_id: universityId, rating: rating.value, comment: comment.value }) })
          .catch(() => ({ data: {} }));
        btn.disabled = false;
        if (data.ok) openDetail(universityId);           // reload to show the new average and review
        else { msg.className = 'meta error'; msg.textContent = data.error || 'Could not save your review.'; }
      };
      return f;
    }

    const closeDetail = () => { $('#overlay').hidden = true; };
    $('#close').onclick = closeDetail;
    $('#overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeDetail(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

    init();
  </script>
</body>
</html>
