<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – ScholarSeek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --blue:#2563EB; --blue-dark:#1d4ed8; --blue-light:#DBEAFE; --text:#111827; --muted:#6B7280; --border:#E5E7EB; --red:#DC2626; }
    body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(145deg, #C7DDFF 0%, #EFF6FF 60%, #D9ECFF 100%); padding: 24px; }
    .card { background:#fff; padding:40px; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.08); width:100%; max-width:420px; }
    .logo { font-weight:800; letter-spacing:-0.5px; text-align:center; margin-bottom:6px; color:var(--text); text-decoration:none; display:block; }
    .logo span { color: var(--blue); }
    .badge { display:block; width:max-content; margin:0 auto 22px; font-size:.7rem; font-weight:700; padding:3px 12px; border-radius:50px; background:var(--blue-light); color:var(--blue-dark); letter-spacing:.04em; text-transform:uppercase; }
    h1 { font-size:1.6rem; font-weight:800; color:var(--text); text-align:center; margin-bottom:24px; }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:.8rem; font-weight:600; margin-bottom:6px; color:var(--text); }
    .field input { width:100%; padding:12px; border:1.5px solid var(--border); border-radius:8px; font:inherit; font-size:.9rem; outline:none; }
    .field input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    .btn { width:100%; padding:14px; background:var(--blue); color:#fff; border:none; border-radius:50px; font:inherit; font-size:.95rem; font-weight:700; cursor:pointer; margin-top:6px; }
    .btn:hover { background:var(--blue-dark); }
    .btn:disabled { opacity:.6; cursor:default; }
    #error { color:var(--red); font-size:.85rem; margin-top:12px; min-height:1.2em; text-align:center; }
    .footer-text { margin-top:18px; text-align:center; font-size:.85rem; color:var(--muted); }
    .footer-text a { color:var(--blue); text-decoration:none; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="logo">Scholar<span>Seek</span></a>
    <span class="badge">Admin</span>
    <h1>Admin Login</h1>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="admin@scholarseek.id" autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" />
    </div>

    <button class="btn" id="login-btn" type="button" onclick="handleAdminLogin()">Login as Admin</button>
    <div id="error"></div>
    <p class="footer-text">Not an admin? <a href="login.html">Student / consultant login</a></p>
  </div>

  <script>
    async function handleAdminLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('error');
      const btn = document.getElementById('login-btn');
      errorBox.textContent = '';

      if (!email || !password) { errorBox.textContent = 'Please fill in all fields.'; return; }

      btn.disabled = true;
      const res = await fetch('/api/login', { method: 'POST', body: new URLSearchParams({ email, password }) })
        .catch(() => null);
      const data = res ? await res.json().catch(() => ({})) : {};
      btn.disabled = false;

      if (!data.ok) { errorBox.textContent = data.error || 'Cannot reach the server.'; return; }

      // Only admin accounts may continue; anyone else is logged straight back out.
      if (!data.user || data.user.role !== 'admin') {
        await fetch('/api/logout', { method: 'POST', body: new URLSearchParams({}) }).catch(() => null);
        errorBox.textContent = 'This account is not an admin account.';
        return;
      }
      window.location.href = 'admin.html';
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') handleAdminLogin();
    });
  </script>
</body>
</html>
